name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fakeroot \
            debhelper \
            dpkg-dev \
            ibus \
            python3-gi \
            gir1.2-ibus-1.0 \
            gir1.2-glib-2.0

      - name: Install Python test tools
        run: |
          python3 -m pip install --upgrade pip pytest hypothesis

      - name: Validate Tree
        run: bash scripts/check-tree.sh

      - name: Build and Verify Debian Package
        run: bash scripts/build-deb.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banglaflow-debian-package
          path: banglaflow.deb


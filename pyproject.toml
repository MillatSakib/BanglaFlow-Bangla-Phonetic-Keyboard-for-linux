[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banglaflow"
version = "1.0.1"
description = "Native Bengali Phonetic Input Method for Linux (IBus)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Sakib", email = "sakib@example.com" }
]
keywords = ["bengali", "bangla", "ibus", "input-method", "phonetic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Gnome",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
banglaflow-engine = "banglaflow.engine_main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["banglaflow*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: marks integration tests that need a running desktop/display (deselect with '-m \"not integration\"')",
]

